[package]
name = "image-effects"
description = "An assortment of effects that can be applied to an image with the help of `image`."
version = "0.2.1"
license = "MPL-2.0"
readme = "README.md"
keywords = ["image", "effects", "dither"]
categories = ["multimedia::images"]
authors = ["enbyss"]
edition = "2021"

[badges]
maintenance = { status = "actively-developed" }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
image = "0.24.6"
num = "0.4.1" # may not be used
ndarray = "0.15.6"
once_cell = "1.18.0"
palette = "0.7.2"
rand = "0.8.5"
enum_dispatch = "0.3.13"
rayon = "1.11.0"

[dev-dependencies]
base64 = "0.21.2"
reqwest = { version = "0.11.18", features = ["blocking"] }